<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-5">
  <div class="card shadow">
    <div class="card-header"><h2>Notifications</h2></div>
    <div class="card-body">
      <div class="alert alert-success"><strong>Success!</strong> Your profile has been updated.</div>
      <div class="alert alert-info"><strong>Tip:</strong> Complete your profile to improve your experience.</div>
      <div class="alert alert-danger"><strong>Warning!</strong> Your password will expire soon.</div>
      <div class="alert alert-warning alert-dismissible fade show">
        New security settings are available.
        <button class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <section class="bg-light border p-4 mt-4">
        <h4>Summary</h4><p>You have 3 new notifications and 1 pending task.</p>
      </section>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
