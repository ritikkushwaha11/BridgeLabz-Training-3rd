<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">
<header class="text-center p-5">
  <h1 class="fw-bold">Ishita kumari</h1>
  <p class="lead">Cybersecurity Student &amp; Web Developer</p>
</header>
<main>
  <section class="container text-center">
    <img src="https://via.placeholder.com/180" class="img-fluid rounded-circle mb-3" alt="Profile">
    <h2 class="fw-bold">About Me</h2>
    <p>I am passionate about cybersecurity, web development and technology.</p>
    <div class="mt-4 mb-3">
      <button class="btn btn-primary me-2">Hire Me</button>
      <button class="btn btn-outline-dark">Download CV</button>
    </div>
    <form class="mx-auto mt-4" style="max-width:500px;">
      <input type="text" class="form-control mb-3" placeholder="Your Name">
      <input type="email" class="form-control mb-3" placeholder="Your Email">
      <textarea class="form-control mb-3" placeholder="Your Message"></textarea>
      <button class="btn btn-success">Send Message</button>
    </form>
  </section>
</main>
</body>
</html>
