<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini UI Layout</title>
  <link rel="stylesheet" href="q10.css">
</head>
<body>
  <header class="site-header"><h1>Mini User Interface</h1></header>
  <main class="main-area">
    <section class="card">
      <div class="image-area">
        <img src="https://picsum.photos/350/240?20" alt="Sample">
      </div>
      <form>
        <h2>Contact Form</h2>
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Enter your name">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Enter your email">
        <label for="message">Message</label>
        <textarea id="message" rows="4" placeholder="Write a message"></textarea>
        <div class="actions">
          <button type="submit">Submit</button>
          <button type="reset" class="secondary">Reset</button>
        </div>
      </form>
    </section>
  </main>
  <footer class="site-footer"><p>Assignment 8 - Question 10</p></footer>
</body>
</html>
