<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header class="text-center p-5 bg-dark text-white">
  <h1>Spice Garden</h1><p class="lead">Today's Menu</p>
</header>
<main class="container py-5">
  <section>
    <table class="table table-striped table-hover">
      <thead class="table-dark"><tr><th>Item</th><th>Category</th><th>Price</th></tr></thead>
      <tbody>
        <tr><td>Paneer Tikka</td><td>Starter</td><td>₹250</td></tr>
        <tr><td>Butter Chicken</td><td>Main Course</td><td>₹350</td></tr>
        <tr><td>Veg Biryani</td><td>Main Course</td><td>₹220</td></tr>
        <tr><td>Gulab Jamun</td><td>Dessert</td><td>₹100</td></tr>
      </tbody>
    </table>
  </section>
  <section class="mt-5">
    <h2>Chef's Specials</h2>
    <ul class="list-group">
      <li class="list-group-item">Special Paneer Tikka</li>
      <li class="list-group-item">Chef's Biryani</li>
      <li class="list-group-item">Chocolate Brownie</li>
    </ul>
  </section>
  <section class="text-center mt-5">
    <img src="https://via.placeholder.com/700x350" class="img-fluid rounded" alt="Restaurant Food">
    <p class="text-muted mt-2">Freshly prepared dishes from our kitchen.</p>
  </section>
</main>
</body>
</html>
