<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q8 - Filter Comparison Layout</title>
  <link rel="stylesheet" href="filter-comparison.css">
</head>
<body>
  <header><h1>Filter Comparison</h1><p>Compare the original image with a filtered version.</p></header>
  <main class="comparison">
    <figure><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Original mountain lake"><figcaption>Before: Original</figcaption></figure>
    <figure><img class="filtered" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Filtered mountain lake"><figcaption>After: Brightness Filter</figcaption></figure>
  </main>
</body>
</html>
