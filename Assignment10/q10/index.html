<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Agency</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header class="bg-dark text-white text-center p-4">
  <h1>Dream Travels</h1><p>Explore the World</p>
</header>
<main>
  <section>
    <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active" data-bs-interval="3000">
          <img src="https://via.placeholder.com/1200x500" class="d-block w-100" alt="Paris">
          <div class="carousel-caption"><h2>Paris</h2><p>Experience the city of lights.</p></div>
        </div>
        <div class="carousel-item" data-bs-interval="3000">
          <img src="https://via.placeholder.com/1200x500" class="d-block w-100" alt="Maldives">
          <div class="carousel-caption"><h2>Maldives</h2><p>Relax on beautiful tropical beaches.</p></div>
        </div>
        <div class="carousel-item" data-bs-interval="3000">
          <img src="https://via.placeholder.com/1200x500" class="d-block w-100" alt="Dubai">
          <div class="carousel-caption"><h2>Dubai</h2><p>Discover modern luxury and adventure.</p></div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </section>
  <section class="container py-5">
    <h3>Booking Progress</h3>
    <div class="progress">
      <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:70%">70%</div>
    </div>
  </section>
</main>
<footer class="bg-dark text-white text-center p-4">
  <p>Email: info@dreamtravels.com</p>
  <p>Phone: +91 98765 43210</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
