<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Pagination</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-5">
  <h1 class="text-center mb-4">My Blog</h1>
  <article class="mb-4">
    <h2>Introduction to Bootstrap</h2>
    <p>Bootstrap makes responsive web development faster and easier.</p>
  </article>
  <nav>
    <ul class="pagination justify-content-center">
      <li class="page-item"><a class="page-link" href="#">Previous</a></li>
      <li class="page-item active"><a class="page-link" href="#">1</a></li>
      <li class="page-item"><a class="page-link" href="#">2</a></li>
      <li class="page-item"><a class="page-link" href="#">Next</a></li>
    </ul>
  </nav>
  <div class="d-flex justify-content-between mt-4">
    <button class="btn btn-outline-secondary">Older Posts</button>
    <button class="btn btn-outline-secondary">Newer Posts</button>
  </div>
</main>
</body>
</html>
