<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container py-5">
  <h1 class="text-center mb-5">Choose Your Plan</h1>
  <div class="row g-4">
    <div class="col-md-4"><div class="card plan shadow-lg h-100"><div class="card-body text-center">
      <h3>Basic</h3><h2>₹499/month</h2>
      <ul class="list-group list-group-flush my-4">
        <li class="list-group-item">5 Projects</li><li class="list-group-item">1 GB Storage</li><li class="list-group-item">Email Support</li>
      </ul><button class="btn btn-outline-primary">Choose Plan</button>
    </div></div></div>
    <div class="col-md-4"><div class="card plan shadow-lg bg-primary text-white h-100"><div class="card-body text-center">
      <h3>Pro</h3><h2>₹999/month</h2>
      <ul class="list-group list-group-flush my-4">
        <li class="list-group-item">Unlimited Projects</li><li class="list-group-item">10 GB Storage</li><li class="list-group-item">Priority Support</li>
      </ul><button class="btn btn-light">Choose Plan</button>
    </div></div></div>
    <div class="col-md-4"><div class="card plan shadow-lg h-100"><div class="card-body text-center">
      <h3>Premium</h3><h2>₹1,999/month</h2>
      <ul class="list-group list-group-flush my-4">
        <li class="list-group-item">Unlimited Projects</li><li class="list-group-item">50 GB Storage</li><li class="list-group-item">24/7 Support</li>
      </ul><button class="btn btn-outline-primary">Choose Plan</button>
    </div></div></div>
  </div>
</main>
</body>
</html>
