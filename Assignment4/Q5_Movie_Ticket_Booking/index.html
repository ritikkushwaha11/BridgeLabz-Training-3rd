<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Ticket Booking</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 35px auto; padding: 0 15px; }
    label { display: block; margin: 12px 0; }
    input { display: block; width: 100%; box-sizing: border-box; padding: 8px; margin-top: 5px; }
    button { padding: 9px 15px; }
    #ticket { background: #f2f2f2; padding: 12px; margin-top: 15px; }
    #error { color: red; }
  </style>
</head>
<body>
  <h2>Movie Ticket Booking</h2>
  <form id="bookingForm" novalidate>
    <label>Name <input id="name" type="text"></label>
    <label>Email <input id="email" type="text"></label>
    <label>Seats (1–10) <input id="seats" type="number" min="1" max="10"></label>
    <button type="submit">Book Ticket</button>
  </form>
  <p id="error"></p>
  <div id="ticket"></div>
  <script src="script.js"></script>
</body>
</html>
