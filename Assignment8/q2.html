<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demo</title>
  <link rel="stylesheet" href="q2.css">
</head>
<body>
  <header><h1>CSS Tooltip Demonstration</h1></header>
  <main class="tooltip-area">
    <span class="tooltip">Home<span class="tip-text">Go to Home</span></span>
    <span class="tooltip">Info<span class="tip-text">More Information</span></span>
    <span class="tooltip">Help<span class="tip-text">Need Help?</span></span>
    <span class="tooltip">Profile<span class="tip-text">View Profile</span></span>
  </main>
  <footer><p>Hover over each word to see the tooltip.</p></footer>
</body>
</html>
