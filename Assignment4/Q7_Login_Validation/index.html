<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Validation</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 35px auto; padding: 0 15px; }
    label { display: block; margin: 12px 0; }
    input { display: block; width: 100%; box-sizing: border-box; padding: 8px; margin-top: 5px; }
    button { padding: 9px 15px; }
    #message { white-space: pre-line; }
  </style>
</head>
<body>
  <h2>Login Form</h2>
  <form id="loginForm" novalidate>
    <label>Username <input id="username" type="text"></label>
    <label>Password <input id="password" type="password"></label>
    <button type="submit">Login</button>
  </form>
  <p id="message"></p>
  <script src="script.js"></script>
</body>
</html>
