<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Form Builder</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 450px; margin: 35px auto; padding: 0 15px; }
    label { display: block; margin: 12px 0; }
    input, select { display: block; width: 100%; box-sizing: border-box; padding: 8px; margin-top: 5px; }
    button { padding: 9px 15px; }
    pre { background: #f2f2f2; padding: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Dynamic Form Builder</h2>
  <div id="formContainer"></div>
  <pre id="output"></pre>
  <script src="script.js"></script>
</body>
</html>
