<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bg-dark text-white text-center p-4"><h1>Tech Store</h1></header>
<main class="container py-5">
  <h2 class="text-center mb-4">Our Products</h2>
  <div class="row g-4">
    <div class="col-12 col-sm-6 col-md-3"><div class="card shadow-sm product-card h-100">
      <img src="https://via.placeholder.com/300" class="card-img-top" alt="Laptop">
      <div class="card-body text-center"><h5>Laptop</h5><p>₹55,000</p><button class="btn btn-primary">Add to Cart</button></div>
    </div></div>
    <div class="col-12 col-sm-6 col-md-3"><div class="card shadow-sm product-card h-100">
      <img src="https://via.placeholder.com/300" class="card-img-top" alt="Phone">
      <div class="card-body text-center"><h5>Smartphone</h5><p>₹25,000</p><button class="btn btn-primary">Add to Cart</button></div>
    </div></div>
    <div class="col-12 col-sm-6 col-md-3"><div class="card shadow-sm product-card h-100">
      <img src="https://via.placeholder.com/300" class="card-img-top" alt="Headphones">
      <div class="card-body text-center"><h5>Headphones</h5><p>₹3,000</p><button class="btn btn-primary">Add to Cart</button></div>
    </div></div>
    <div class="col-12 col-sm-6 col-md-3"><div class="card shadow-sm product-card h-100">
      <img src="https://via.placeholder.com/300" class="card-img-top" alt="Watch">
      <div class="card-body text-center"><h5>Smart Watch</h5><p>₹5,000</p><button class="btn btn-primary">Add to Cart</button></div>
    </div></div>
  </div>
</main>
</body>
</html>
