<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-5">
  <header class="d-flex justify-content-between align-items-center mb-4">
    <h1>Task Tracker</h1>
    <span class="badge bg-danger">5 Pending</span>
  </header>
  <div class="list-group">
    <div class="list-group-item d-flex justify-content-between">Complete Bootstrap Assignment <span class="badge bg-danger">High</span></div>
    <div class="list-group-item d-flex justify-content-between">Study CSS <span class="badge bg-warning text-dark">Medium</span></div>
    <div class="list-group-item d-flex justify-content-between">Read Documentation <span class="badge bg-success">Low</span></div>
    <div class="list-group-item d-flex justify-content-between">Submit Project <span class="badge bg-danger">High</span></div>
  </div>
  <button class="btn btn-success mt-4">Completed <span class="badge bg-light text-dark">3</span></button>
</main>
</body>
</html>
