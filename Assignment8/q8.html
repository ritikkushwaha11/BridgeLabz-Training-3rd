<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Sizing Comparison</title>
  <link rel="stylesheet" href="q8.css">
</head>
<body>
  <header><h1>Box-Sizing Comparison</h1></header>
  <main class="comparison">
    <section class="box content-box">
      <h2>content-box</h2>
      <p>With the default content-box, width applies only to content. Padding and border are added outside that width.</p>
    </section>
    <section class="box border-box">
      <h2>border-box</h2>
      <p>With border-box, width includes content, padding and border, so the total size stays within the specified width.</p>
    </section>
  </main>
</body>
</html>
