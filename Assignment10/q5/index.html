<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Blog</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="py-4 text-center">
  <h1>Tech &amp; Life Blog</h1>
  <p>Ideas, technology and inspiration</p>
</header>
<main class="container py-5">
  <div class="row g-4">
    <article class="col-md-6">
      <div class="card h-100 shadow"><div class="card-body">
        <h2 class="card-title">The Future of AI</h2>
        <p class="card-text">Artificial intelligence is changing how we learn, work and communicate.</p>
        <button class="btn btn-primary">Read More</button>
      </div></div>
    </article>
    <article class="col-md-6">
      <div class="card h-100 shadow"><div class="card-body">
        <h2 class="card-title">Learning Web Development</h2>
        <p class="card-text">Learn the fundamentals of HTML, CSS, Bootstrap and modern web design.</p>
        <button class="btn btn-primary">Read More</button>
      </div></div>
    </article>
  </div>
</main>
<footer class="text-center p-4">&copy; 2026 Tech &amp; Life Blog</footer>
</body>
</html>
