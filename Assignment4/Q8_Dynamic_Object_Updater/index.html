<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Object Updater</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 35px auto; padding: 0 15px; }
    label { display: block; margin: 12px 0; }
    input { display: block; width: 100%; box-sizing: border-box; padding: 8px; margin-top: 5px; }
    button { padding: 9px 15px; }
    pre { background: #f2f2f2; padding: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Edit User Details</h2>
  <form id="userForm">
    <label>Name <input id="name" type="text"></label>
    <label>Email <input id="email" type="email"></label>
    <label>Age <input id="age" type="number" min="0"></label>
    <button type="submit">Update User</button>
  </form>
  <h3>Updated User Object</h3>
  <pre id="output"></pre>
  <script src="script.js"></script>
</body>
</html>
